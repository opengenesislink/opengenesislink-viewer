name: Viewer C++ CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: viewer-cpp-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libcurl4-openssl-dev nlohmann-json3-dev
      - name: Configure release
        run: cmake --preset release -DOGL_VIEWER_ENABLE_WERROR=ON
      - name: Build
        run: cmake --build --preset release
      - name: Unit tests
        run: ctest --preset release
