name: Viewer Windows C++ CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: viewer-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-x86_64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Prepare vcpkg binary cache
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\.vcpkg-cache" | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$env:GITHUB_WORKSPACE\.vcpkg-cache" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-viewer-windows-x64-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-viewer-windows-x64-
      - name: Install dependencies
        shell: pwsh
        run: vcpkg install --triplet x64-windows
      - name: Configure release
        shell: pwsh
        run: >
          cmake -S . -B build/windows -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DOGL_VIEWER_BUILD_TESTS=ON
          -DOGL_VIEWER_ENABLE_WERROR=ON
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Build
        shell: pwsh
        # vcpkg z-applocal copies shared runtime DLLs beside each test binary.
        # Parallel links can race on the same destination DLL in this build dir.
        run: cmake --build build/windows --parallel 1
      - name: Unit tests
        shell: pwsh
        run: ctest --test-dir build/windows --output-on-failure
      - name: Install smoke
        shell: pwsh
        run: |
          cmake --install build/windows --prefix build/install
          if (-not (Test-Path "build/install/bin/ogl-viewer.exe")) {
            throw "Installed Viewer executable is missing"
          }
